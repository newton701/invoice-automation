spring.application.name=invoice-automation
server.port=8080

# Keep secrets out of source control. Set DB_PASSWORD in IntelliJ Run Configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/"your db name"}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates tables for @Entity classes. The database itself must exist first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Output files are generated when POST /api/pipeline/run is called.
invoice.output-dir=data/output
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
